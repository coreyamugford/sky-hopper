<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Hopper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  *{box-sizing:border-box} body{margin:0}
  /* Layout: one centred portrait game screen, scaled to fit the window, with a short controls line under it. Single deliberate look (arcade night frame). */
  :root {
    --frame: #1b2233;
    --frame-edge: #2c3650;
    --ink: #e9edf6;
    --muted: #9aa6c2;
    --accent: #ffb547;
    --pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--frame);
    color: var(--ink);
    font-family: var(--pixel);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding-inline: 16px;
    padding-block: 12px;
    box-sizing: border-box;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative;
    height: min(calc(100% - 48px), 760px);
    aspect-ratio: 288 / 512;
    max-width: 100%;
    border: 4px solid var(--frame-edge);
    border-radius: 6px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
    overflow: hidden;
    touch-action: none;
    cursor: pointer;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #stage:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .help {
    font-size: 9px;
    line-height: 1.6;
    color: var(--muted);
    text-align: center;
    letter-spacing: .04em;
  }
  .help b { color: var(--accent); font-weight: normal; }
</style>

</head><body>
<div id="stage" tabindex="0" aria-label="Sky Hopper game. Press space or click to flap.">
  <canvas id="game" width="288" height="512"></canvas>
</div>
<p class="help"><b>SPACE</b> / <b>CLICK</b> / <b>TAP</b> to flap &nbsp;·&nbsp; <b>P</b> to pause &nbsp;·&nbsp; <b>M</b> to mute</p>

<script>
(() => {
  const W = 288, H = 512, GROUND_H = 96, FLOOR = H - GROUND_H;
  const canvas = document.getElementById('game');
  const stage = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // ---- Tuning (per 60fps frame, like the original arcade feel) ----
  const GRAVITY = 0.25;
  const FLAP = -4.6;
  const MAX_FALL = 8;
  const SPEED = 2;
  const PIPE_W = 52;
  const GAP = 104;
  const PIPE_SPACING = 179; // 156 + 15%
  const BIRD_X = 72;
  const BIRD_R = 11;

  // ---- Storage (best score, mute) ----
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let best = store.get('skyhopper.best', 0);
  let muted = store.get('skyhopper.muted', false);

  // ---- Sound (WebAudio blips, starts after first input) ----
  let actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type = 'square', vol = 0.08, slideTo = null, delay = 0) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    flap() { tone(520, 0.09, 'triangle', 0.12, 820); },
    point() { tone(880, 0.07, 'square', 0.06); tone(1320, 0.12, 'square', 0.06, null, 0.07); },
    hit() { tone(180, 0.25, 'sawtooth', 0.12, 60); },
    fall() { tone(600, 0.45, 'triangle', 0.08, 120, 0.15); },
    swoosh() { tone(300, 0.15, 'sine', 0.06, 700); }
  };

  // ---- Background scenery (pre-rendered) ----
  const clouds = [], hills = [], city = [];
  (function buildScenery() {
    let x = 0; while (x < W * 2) { clouds.push({ x, y: 250 + Math.random() * 40, r: 18 + Math.random() * 16 }); x += 26 + Math.random() * 20; }
    x = 0; while (x < W * 2) { const w = 22 + Math.random() * 26; city.push({ x, w, h: 40 + Math.random() * 60 }); x += w + 2; }
    x = 0; while (x < W * 2) { const w = 40 + Math.random() * 40; hills.push({ x, w, h: 18 + Math.random() * 22 }); x += w * 0.8; }
  })();

  // ---- Game state ----
  let state, bird, pipes, score, groundX, bgX, flashT, overT, shake, newBest, paused, frame;

  function reset() {
    state = 'ready';
    bird = { y: H * 0.42, vy: 0, rot: 0, wing: 0 };
    pipes = [];
    score = 0;
    flashT = 0; overT = 0; shake = 0; newBest = false; paused = false; frame = 0;
  }
  groundX = 0; bgX = 0;
  reset();

  function spawnPipe(x) {
    const minTop = 60, maxTop = FLOOR - GAP - 60;
    pipes.push({ x, top: minTop + Math.random() * (maxTop - minTop), scored: false });
  }

  function flap() {
    if (paused) return;
    if (state === 'ready') {
      state = 'play';
      spawnPipe(W + 40);
    }
    if (state === 'play') {
      bird.vy = FLAP;
      sfx.flap();
    } else if (state === 'over' && overT > 40) {
      sfx.swoosh();
      reset();
    }
  }

  function die() {
    if (state !== 'play') return;
    state = 'over';
    flashT = 8; shake = 10; overT = 0;
    sfx.hit();
    if (bird.y < FLOOR - BIRD_R - 2) sfx.fall();
    if (score > best) { best = score; newBest = true; store.set('skyhopper.best', best); }
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  // ---- Update (fixed 60Hz step) ----
  function update() {
    frame++;
    if (flashT > 0) flashT--;
    if (shake > 0) shake--;

    if (state !== 'over') {
      groundX = (groundX - SPEED) % 24;
      bgX = (bgX - SPEED * 0.25) % (W * 2);
      bird.wing += state === 'ready' ? 0.15 : 0.3;
    }

    if (state === 'ready') {
      bird.y = H * 0.42 + Math.sin(frame / 10) * 5;
      bird.rot = 0;
      return;
    }

    if (state === 'play') {
      bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
      bird.y += bird.vy;
      bird.rot = bird.vy < 0 ? -0.45 : Math.min(bird.rot + 0.06, 1.5);
      if (bird.vy < 0) bird.rot = -0.45;

      if (bird.y < -20) { bird.y = -20; bird.vy = 0; }

      for (const p of pipes) {
        p.x -= SPEED;
        if (!p.scored && p.x + PIPE_W < BIRD_X) {
          p.scored = true; score++; sfx.point();
        }
        if (circleRect(BIRD_X, bird.y, BIRD_R - 1, p.x, -100, PIPE_W, p.top + 100) ||
            circleRect(BIRD_X, bird.y, BIRD_R - 1, p.x, p.top + GAP, PIPE_W, FLOOR)) {
          die();
        }
      }
      if (pipes.length && pipes[0].x < -PIPE_W - 10) pipes.shift();
      const last = pipes[pipes.length - 1];
      if (last && last.x < W + 40 - PIPE_SPACING) spawnPipe(last.x + PIPE_SPACING);

      if (bird.y + BIRD_R >= FLOOR) { bird.y = FLOOR - BIRD_R; die(); }
      return;
    }

    // over: bird falls to the ground
    overT++;
    if (bird.y + BIRD_R < FLOOR) {
      bird.vy = Math.min(bird.vy + GRAVITY * 1.4, MAX_FALL + 2);
      bird.y = Math.min(bird.y + bird.vy, FLOOR - BIRD_R);
      bird.rot = Math.min(bird.rot + 0.12, 1.57);
    }
  }

  // ---- Drawing ----
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, FLOOR);
    g.addColorStop(0, '#4ec0d9');
    g.addColorStop(1, '#bde9ef');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, FLOOR);

    // clouds
    ctx.fillStyle = '#eaf8fa';
    for (const c of clouds) {
      let x = ((c.x + bgX * 0.5) % (W * 2) + W * 2) % (W * 2) - 40;
      ctx.beginPath(); ctx.arc(x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillRect(0, 285, W, FLOOR - 285);

    // city skyline
    for (const b of city) {
      let x = ((b.x + bgX) % (W * 2) + W * 2) % (W * 2) - 40;
      const y = FLOOR - 30 - b.h;
      ctx.fillStyle = '#9fd6c9';
      ctx.fillRect(x, y, b.w, b.h + 30);
      ctx.fillStyle = '#c6ece4';
      for (let wy = y + 6; wy < FLOOR - 34; wy += 9)
        for (let wx = x + 4; wx < x + b.w - 4; wx += 7)
          ctx.fillRect(wx, wy, 3, 4);
    }
    // bushes
    ctx.fillStyle = '#6fcf6a';
    for (const h of hills) {
      let x = ((h.x + bgX * 1.6) % (W * 2) + W * 2) % (W * 2) - 40;
      ctx.beginPath(); ctx.ellipse(x + h.w / 2, FLOOR, h.w / 2, h.h + 10, 0, Math.PI, 0); ctx.fill();
    }
    ctx.fillStyle = '#5bbd57';
    ctx.fillRect(0, FLOOR - 6, W, 6);
  }

  function drawPipe(x, y, h, flip) {
    if (h <= 0) return;
    const capH = 24, capOver = 3;
    const body = (bx, by, bw, bh) => {
      const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, '#5a8f2a');
      g.addColorStop(0.18, '#9be05a');
      g.addColorStop(0.45, '#7cc63e');
      g.addColorStop(1, '#4b7a22');
      ctx.fillStyle = g;
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = '#2d4a14'; ctx.lineWidth = 2;
      ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
    };
    if (!flip) {
      body(x, y + capH, PIPE_W, h - capH);
      body(x - capOver, y, PIPE_W + capOver * 2, capH);
    } else {
      body(x, y, PIPE_W, h - capH);
      body(x - capOver, y + h - capH, PIPE_W + capOver * 2, capH);
    }
  }

  function drawGround() {
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, FLOOR, W, GROUND_H);
    // striped top band
    ctx.fillStyle = '#73bf2e';
    ctx.fillRect(0, FLOOR, W, 12);
    ctx.fillStyle = '#9ce659';
    for (let x = groundX; x < W + 24; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, FLOOR + 12); ctx.lineTo(x + 12, FLOOR); ctx.lineTo(x + 24, FLOOR); ctx.lineTo(x + 12, FLOOR + 12);
      ctx.fill();
    }
    ctx.fillStyle = '#558022';
    ctx.fillRect(0, FLOOR + 12, W, 3);
    ctx.fillStyle = '#4a7a1e';
    ctx.fillRect(0, FLOOR, W, 2);
    ctx.fillStyle = '#d0c87d';
    ctx.fillRect(0, FLOOR + 15, W, 4);
  }

  // An original round bird: plum body, peach belly, orange beak, flapping wing.
  function drawBird() {
    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.rot);
    // tail
    ctx.fillStyle = '#5b2a6e';
    ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(-19, -7); ctx.lineTo(-17, 1); ctx.lineTo(-19, 6); ctx.lineTo(-10, 3); ctx.fill();
    // body
    ctx.fillStyle = '#8e44ad';
    ctx.beginPath(); ctx.ellipse(0, 0, 13, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a1748'; ctx.lineWidth = 2; ctx.stroke();
    // belly
    ctx.fillStyle = '#ffd3a8';
    ctx.beginPath(); ctx.ellipse(2, 5, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
    // wing
    const w = Math.sin(bird.wing) * 5;
    ctx.fillStyle = '#c38ddb';
    ctx.beginPath(); ctx.ellipse(-4, 1 + w * 0.4, 7, 4 + Math.abs(w) * 0.3, -0.3 + w * 0.06, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a1748'; ctx.lineWidth = 1.5; ctx.stroke();
    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(5, -4, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a1748'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#1b1020';
    ctx.beginPath(); ctx.arc(6.5, -4, 2, 0, Math.PI * 2); ctx.fill();
    // beak
    ctx.fillStyle = '#ff8a2a';
    ctx.beginPath(); ctx.moveTo(10, -1); ctx.lineTo(19, 1); ctx.lineTo(10, 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#a24b0c'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }

  function text(str, x, y, size, fill = '#fff', align = 'center', stroke = '#2b1a33') {
    ctx.font = `${size}px "Press Start 2P", ui-monospace, monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(3, size / 4);
    ctx.strokeStyle = stroke;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function medalFor(s) {
    if (s >= 40) return { name: 'PLATINUM', c: '#e6f0ff', d: '#9fb3d1' };
    if (s >= 30) return { name: 'GOLD', c: '#ffd34d', d: '#c99a12' };
    if (s >= 20) return { name: 'SILVER', c: '#e3e6ea', d: '#9aa1aa' };
    if (s >= 10) return { name: 'BRONZE', c: '#e3a065', d: '#a4602b' };
    return null;
  }

  function drawReady() {
    text('SKY HOPPER', W / 2, 92, 22, '#ffb547');
    text('GET READY', W / 2, 140, 14, '#fff');
    // tap hint
    const pulse = 0.6 + Math.sin(frame / 8) * 0.4;
    ctx.globalAlpha = pulse;
    text('TAP / SPACE', W / 2, 290, 10, '#fff');
    ctx.globalAlpha = 1;
    // little arrow hint
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(BIRD_X + 28, H * 0.42); ctx.lineTo(BIRD_X + 38, H * 0.42 - 6); ctx.lineTo(BIRD_X + 38, H * 0.42 + 6); ctx.fill();
    if (best > 0) text('BEST ' + best, W / 2, 330, 9, '#ffe7b8');
  }

  function drawOver() {
    const t = Math.min(overT / 20, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    text('GAME OVER', W / 2, 110 - (1 - ease) * 30, 22, '#ff6b5a');

    if (overT < 15) return;
    const pt = Math.min((overT - 15) / 20, 1);
    const py = 160 + (1 - (1 - Math.pow(1 - pt, 3))) * 200;
    const px = 24, pw = W - 48, ph = 120;
    ctx.fillStyle = '#ded895';
    roundRect(px, py, pw, ph, 8); ctx.fill();
    ctx.strokeStyle = '#543847'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#cfc681';
    roundRect(px + 8, py + 8, pw - 16, ph - 16, 6); ctx.fill();

    // medal
    const m = medalFor(score);
    text('MEDAL', px + 50, py + 26, 8, '#e06b3c', 'center', '#fff6d6');
    ctx.fillStyle = '#e4dc9b';
    ctx.beginPath(); ctx.arc(px + 50, py + 70, 24, 0, Math.PI * 2); ctx.fill();
    if (m) {
      ctx.fillStyle = m.d; ctx.beginPath(); ctx.arc(px + 50, py + 70, 22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = m.c; ctx.beginPath(); ctx.arc(px + 50, py + 70, 18, 0, Math.PI * 2); ctx.fill();
      // star
      ctx.fillStyle = m.d;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 ? 4 : 9, a = -Math.PI / 2 + i * Math.PI / 5;
        ctx.lineTo(px + 50 + Math.cos(a) * r, py + 70 + Math.sin(a) * r);
      }
      ctx.fill();
      // sparkle
      if ((frame >> 3) % 2) { ctx.fillStyle = '#fff'; ctx.fillRect(px + 38, py + 58, 3, 3); }
    }

    text('SCORE', px + pw - 20, py + 26, 8, '#e06b3c', 'right', '#fff6d6');
    text(String(score), px + pw - 20, py + 46, 14, '#fff', 'right');
    text('BEST', px + pw - 20, py + 72, 8, '#e06b3c', 'right', '#fff6d6');
    text(String(best), px + pw - 20, py + 92, 14, '#fff', 'right');
    if (newBest) text('NEW', px + pw - 80, py + 72, 8, '#fff', 'center', '#e0433c');

    if (overT > 40) {
      // play button
      const bx = W / 2 - 52, by = py + ph + 22, bw = 104, bh = 36;
      ctx.fillStyle = '#e86a17';
      roundRect(bx, by + 3, bw, bh, 6); ctx.fill();
      ctx.fillStyle = '#ffb547';
      roundRect(bx, by, bw, bh, 6); ctx.fill();
      ctx.strokeStyle = '#543847'; ctx.lineWidth = 2; ctx.stroke();
      text('PLAY', W / 2, by + bh / 2 + 1, 12, '#fff', 'center', '#7a3410');
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawSky();
    for (const p of pipes) {
      drawPipe(p.x, 0, p.top, true);
      drawPipe(p.x, p.top + GAP, FLOOR - (p.top + GAP), false);
    }
    drawGround();
    drawBird();
    ctx.restore();

    if (state === 'play') text(String(score), W / 2, 60, 28, '#fff');
    if (state === 'ready') drawReady();
    if (state === 'over') drawOver();

    if (paused) {
      ctx.fillStyle = 'rgba(20,24,40,.45)'; ctx.fillRect(0, 0, W, H);
      text('PAUSED', W / 2, H / 2 - 10, 18, '#fff');
      text('P TO RESUME', W / 2, H / 2 + 20, 8, '#ffe7b8');
    }
    if (muted) text('MUTED', W - 8, H - 12, 7, '#fff', 'right');

    if (flashT > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashT / 8})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---- Loop with fixed timestep so speed is the same on 60/120/144Hz screens ----
  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 250);
    last = now;
    while (acc >= STEP) { if (!paused) update(); acc -= STEP; }
    draw();
    requestAnimationFrame(loop);
  }

  // ---- Input ----
  function onPress(e) {
    e.preventDefault();
    audio();
    stage.focus({ preventScroll: true });
    flap();
  }
  stage.addEventListener('pointerdown', onPress);
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); audio(); flap(); }
    else if (e.code === 'KeyP' && state === 'play') { paused = !paused; }
    else if (e.code === 'KeyM') { muted = !muted; store.set('skyhopper.muted', muted); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

  const start = () => requestAnimationFrame((t) => { last = t; loop(t); });
  if (document.fonts && document.fonts.load) {
    document.fonts.load('12px "Press Start 2P"').finally(start);
  } else start();
})();
</script>

</body></html>
